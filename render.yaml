# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: galligraph
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: CIVICPULSE_SECRET_KEY
        generateValue: true
      - key: CIVICPULSE_ADMIN_USER
        value: admin
      - key: CIVICPULSE_ADMIN_PASSWORD
        sync: false            # set it in the Render dashboard; never commit it
      - key: CIVICPULSE_SEED_DEMO
        value: "1"
      - key: CIVICPULSE_DEMO_DATA
        value: "1"
      - key: CIVICPULSE_DB
        value: /data/civicpulse.db
      - key: CIVICPULSE_UPLOAD_DIR
        value: /data/uploads
      - key: ANTHROPIC_API_KEY
        sync: false            # optional: enables Claude extraction + photo verification
      - key: CIVICPULSE_WHISPER_API_KEY
        sync: false            # optional: voice notes via a hosted Whisper API (e.g. free Groq key)
      - key: TWILIO_ACCOUNT_SID
        sync: false            # optional: WhatsApp intake + resolution messages
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
